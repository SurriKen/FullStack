<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="intro">
        <h2>Добро пожаловать</h2>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Adipisci vel praesentium molestiae repellat animi ipsum laborum, totam est reiciendis maiores non porro laboriosam impedit harum quidem provident assumenda! Eos, consequatur?</p>
    </div>

    <form action="https:/google.com/search" method="GET">
      <label for="q">Поиск через Гугл: </label>
      <input type="search" name="q" id="q" placeholder="Введите поисковый запрос">
      <button type="submit">Отправить</button>
    </form>

    <form class="form" action="" method="GET">
       <fieldset>
               <legend>Опции</legend>
               <label for="option-1">Опция 1: </label>
               <input type="checkbox" id="option-1" name="option" value="option-1">
               <label for="option-2">Опция 2: </label>
               <input type="checkbox" id="option-2" name="option" value="option-2">
               <label for="option-3">Опция 3: </label>
               <input type="checkbox" id="option-3" name="option" value="option-3">
       </fieldset>
       <fieldset>
               <legend>Варианты</legend>
               <label for="variant-1">Вариант 1: </label>
               <input type="radio" id="variant-1" name="variant" value="variant-1">
               <label for="variant-2">Вариант 2: </label>
               <input type="radio" id="variant-2" name="variant" value="variant-2">
       </fieldset>
       <button type="submit">Показать</button>
</form>
</body>
</html>
